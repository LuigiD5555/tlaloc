name: origami-alpha15-cross-repo

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/origami-alpha15-cross-repo.yml'
      - 'tests/test-origami-alpha15-cross-repo.sh'
      - 'tests/fixtures/fake_openai_vlm.py'
      - 'behavior-lab/internal/closedloop/**'

permissions:
  contents: read

jobs:
  cross-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tlaloc
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: tlaloc
          persist-credentials: false
      - name: Checkout pinned Origami 6.0.0-alpha.15
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: LuigiD5555/origami
          ref: 546f36b05712ffaf3d7324bcbee2b12ddd0d4af7
          path: origami
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Verify pinned release versions
        run: |
          test "$(tr -d '\r\n' < tlaloc/VERSION)" = "6.0.0-alpha.20"
          test "$(tr -d '\r\n' < origami/VERSION)" = "6.0.0-alpha.15"
      - name: Run real cross-repository contract
        env:
          ORIGAMI_ROOT: ${{ github.workspace }}/origami
        run: bash tlaloc/tests/test-origami-alpha15-cross-repo.sh
